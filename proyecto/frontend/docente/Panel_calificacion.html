<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Notas - Calificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../img/logo.png" alt="Logo" width="58" height="80" class="d-inline-block align-text-top me-2">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../docente/inicio_docente.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Calificaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Calendario Académico</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="titulo-panel">Panel de Gestión de Calificaciones</h4>
            <!-- CORRECCIÓN: texto del botón en español -->
            <button type="button" class="btn btn-ingreso" data-bs-toggle="modal" data-bs-target="#modalCalificacion">
                Agregar calificación
            </button>
        </div>

        <!-- Tabla de calificaciones -->
        <div class="table-responsive">
            <table class="table table-hover" id="tablaCalificaciones">
                <thead style="background-color: #1B365D; color: white;">
                    <tr>
                        <th>Estudiante</th>
                        <th>Documento</th>
                        <th>Nota 1</th>
                        <th>Nota 2</th>
                        <th>Nota 3</th>
                        <th>Definitiva</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla">
                    <tr>
                        <td colspan="7" class="text-center">Cargando estudiantes...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- CORRECCIÓN: Modal con formulario completo -->
    <div class="modal fade" id="modalCalificacion" tabindex="-1" aria-labelledby="modalCalificacionLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #1B365D; color: white;">
                    <h5 class="modal-title" id="modalCalificacionLabel">Agregar / Editar Calificación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formCalificacion">
                        <div class="mb-3">
                            <label for="selectEstudiante" class="form-label">Estudiante</label>
                            <select class="form-select" id="selectEstudiante" required>
                                <option value="">-- Seleccione un estudiante --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="nota1" class="form-label">Nota 1 (0.0 - 5.0)</label>
                            <input type="number" class="form-control" id="nota1" name="nota1"
                                   min="0" max="5" step="0.1" placeholder="0.0" required>
                        </div>
                        <div class="mb-3">
                            <label for="nota2" class="form-label">Nota 2 (0.0 - 5.0)</label>
                            <input type="number" class="form-control" id="nota2" name="nota2"
                                   min="0" max="5" step="0.1" placeholder="0.0" required>
                        </div>
                        <div class="mb-3">
                            <label for="nota3" class="form-label">Nota 3 (0.0 - 5.0)</label>
                            <input type="number" class="form-control" id="nota3" name="nota3"
                                   min="0" max="5" step="0.1" placeholder="0.0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Definitiva (calculada automáticamente)</label>
                            <input type="text" class="form-control" id="definitiva" readonly placeholder="--">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-ingreso" id="btnGuardarCalificacion">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Calcular definitiva automáticamente al cambiar notas
        ['nota1', 'nota2', 'nota3'].forEach(id => {
            document.getElementById(id).addEventListener('input', calcularDefinitiva);
        });

        function calcularDefinitiva() {
            const n1 = parseFloat(document.getElementById('nota1').value) || 0;
            const n2 = parseFloat(document.getElementById('nota2').value) || 0;
            const n3 = parseFloat(document.getElementById('nota3').value) || 0;
            const def = ((n1 + n2 + n3) / 3).toFixed(2);
            document.getElementById('definitiva').value = def;
        }

        // Guardar calificación (conectar con backend)
        document.getElementById('btnGuardarCalificacion').addEventListener('click', async () => {
            const form = document.getElementById('formCalificacion');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const payload = {
                id_estudiante: document.getElementById('selectEstudiante').value,
                nota1: document.getElementById('nota1').value,
                nota2: document.getElementById('nota2').value,
                nota3: document.getElementById('nota3').value,
                definitiva: document.getElementById('definitiva').value,
            };

            try {
                const response = await fetch('http://localhost:3000/api/calificaciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Error al guardar");

                alert("Calificación guardada correctamente.");
                bootstrap.Modal.getInstance(document.getElementById('modalCalificacion')).hide();
                form.reset();
                document.getElementById('definitiva').value = '';
            } catch (error) {
                console.error(error);
                alert("No se pudo guardar la calificación.");
            }
        });
    </script>
</body>
</html>
