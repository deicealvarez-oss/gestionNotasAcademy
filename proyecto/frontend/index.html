<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<!--fondo de la pagina-->
<body class="bg-inicio">
   <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="./img/logo.png" alt="Logo" width="58" height="80" class="d-inline-block align-text-top me-2">
            </a> 
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                </ul>
            </div>
        </div>
   </nav>
<!--contenedor del inicio-->
   <div class="div-inicio">
        <form id="loginForm" class="text-center">
            <img src="./img/logo-color.png" alt="Logo" width="70" height="70" >
            <h3>Iniciar Sesión</h3>

            <div class="mb-3">
                <input type="text" class="form-control" name="correo" placeholder="Correo o usuario" id="loginCorreo" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Contraseña" id="loginPassword" autocomplete="current-password" required style="background-color: white; color: #333; border: 1px solid #ccc; padding: 8px 12px; font-size: 16px;">
            </div>
            
            <button type="submit" class="btn btn-ingreso">Ingresar</button>
            <br><br>
            <small><a href="./contraseña.html" class="text-decoration-none">¿Olvidó su contraseña?</a></small>
        </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
