<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Notas - Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <img src="../img/logo.png" alt="Logo" width="58" height="80" class="d-inline-block align-text-top me-2">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Calendario Académico</a></li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="../index.html" id="btnCerrarSesion">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="titulo-panel">Panel de Administración de Usuarios</h1>
            <button id="openModalBtn" class="btn btn-ingreso">Registrar nuevo usuario</button>
        </div>

        <!--tabla que mustra los datos del usuario registrado-->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <thead class="text-center">Acciones
                        <th>eliminar</th>
                        <th>modificar</th>
                    </thead>

                </tr>
            </thead>
            <tbody id="listaUsuarios"></tbody>
        </table>
    </main>

    <!-- formulario de registro -->
    <div id="registerModal" class="modal hidden" aria-hidden="true">
        <div class="modal-box">
            <div class="modal-header">REGISTRAR NUEVO USUARIO</div>

            <form id="registerForm" class="modal-body">
                <div class="col">
                    <h2>Datos personales</h2>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
                    <input type="email" id="correo" name="correo" placeholder="Correo institucional" required />
                    <input type="text" id="direccion" name="direccion" placeholder="Dirección" required />
                    <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required />
                </div>

                <div class="divider"></div>

                <div class="col">
                    <h2>Sistema y rol</h2>

                    <label for="rol">Seleccione el rol</label>
                    <select id="rol" >
                        <option value="ADM">Administrador</option>
                        <option value="PROF">Docente</option>
                        <option value="EST">Estudiante</option>
                    </select>

                    <input type="password" id="password" name="password" placeholder="Contraseña" required />
                </div>

                <!--acciones dentro del formulario-->
                <div class="actions">
                    <button type="submit" class="btn-pill">Guardar</button>
                    <button type="button" id="closeModalBtn" class="btn-outline">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/panelAdmin.js"></script>
    <script>
        // Cerrar sesión del panel de administrador
        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.clear();
        });
    </script>
</body>
</html>
